<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore Love Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a0a2e;--bg2:#0f0414;--rose:#ff4d79;--blush:#ffd6e0;--gold:#f5c27a;--glass:rgba(255,120,160,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 50% 35%,#6b1740 0%,#2d0a30 45%,#0f0414 88%);color:var(--blush);font-family:'Hind Siliguri',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.script{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;bottom:-40px;color:var(--rose);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.5}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
.view{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,transform .8s;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.view.hide{opacity:0;pointer-events:none;transform:scale(1.08)}
#intro{cursor:pointer;text-align:center}
#intro h1{margin:0;font-size:clamp(64px,17vw,150px);line-height:.95;color:#fff;text-shadow:0 0 28px rgba(255,77,121,.75),0 0 70px rgba(255,77,121,.4);animation:glow 3s ease-in-out infinite}
#intro h1 span{display:block}
#intro p{margin:28px 0 0;font-size:17px;color:var(--gold);animation:pulse 1.8s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 40px rgba(255,77,121,1),0 0 100px rgba(255,77,121,.6)}}
@keyframes pulse{50%{opacity:.45}}
#love{touch-action:manipulation}
.stage{position:relative;width:min(94vw,540px);aspect-ratio:1/1.12}
.heart{position:absolute;left:50%;top:50%;width:62%;transform:translate(-50%,-48%);filter:drop-shadow(0 0 26px rgba(255,77,121,.55));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:translate(-50%,-48%) scale(1)}14%{transform:translate(-50%,-48%) scale(1.045)}28%{transform:translate(-50%,-48%) scale(1)}42%{transform:translate(-50%,-48%) scale(1.03)}}
.heart svg{display:block;width:100%;height:auto;overflow:visible}
.chip{position:absolute;left:0;top:0;border:1px solid rgba(245,194,122,.65);background:linear-gradient(135deg,rgba(255,77,121,.38),rgba(90,15,60,.65));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font:600 clamp(13px,3.6vw,17px) 'Hind Siliguri',system-ui,sans-serif;padding:7px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 0 16px rgba(255,77,121,.35);will-change:transform}
.chip:focus-visible,.back:focus-visible,.close:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.back{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;background:var(--glass);border:1px solid rgba(255,214,224,.4);color:var(--blush);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;cursor:pointer}
.title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:0;left:0;text-align:center;font-size:34px;color:#fff;text-shadow:0 0 18px rgba(255,77,121,.7);pointer-events:none}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:14px;color:var(--gold);opacity:.85}
#modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,4,20,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}
#modal.on{opacity:1;pointer-events:auto}
.card{text-align:center;max-width:620px;transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
#modal.on .card{transform:scale(1)}
.card h2{margin:0 0 18px;font-size:clamp(52px,14vw,96px);line-height:1;color:#fff;text-shadow:0 0 26px rgba(255,77,121,.8)}
.card p{margin:0;font-size:clamp(20px,5.2vw,30px);line-height:1.7;color:var(--blush)}
.card .em{font-size:48px;display:block;margin-bottom:6px}
.close{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);background:none;border:0;color:var(--blush);font-size:34px;cursor:pointer}
.petal{position:absolute;top:-30px;background:radial-gradient(circle at 30% 30%,#ff9db5,#d81b4a);border-radius:80% 0 80% 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(70px,115vh,0) rotate(600deg)}}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px #ffd6e0;opacity:0;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.3)}}
.first{max-width:420px;margin:22px auto 0!important;font-size:clamp(17px,4.4vw,21px)!important;line-height:1.7;color:#ffe3ea!important;animation:none!important}
.sub{font-size:clamp(24px,6vw,36px);color:var(--gold);margin-top:18px;text-shadow:0 0 14px rgba(245,194,122,.5)}
#love:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,77,121,.18),transparent 60%);pointer-events:none}
@media (prefers-reduced-motion:reduce){.heart,#intro h1,#intro p,.bg i,.petal,.spark{animation:none}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<section class="view" id="intro" tabindex="0" role="button" aria-label="Explore Love Universe">
  <h1 class="script"><span>Explore</span><span>Love</span><span>Universe</span></h1>
  <div class="script sub">where every moment of us lives</div>
  <p class="first">তুমি আমার জীবনের সবচেয়ে সুন্দর গল্প। এই ছোট্ট মহাবিশ্বটা শুধু তোমার আর আমার জন্য ♥</p>
  <p>Tap here ♥</p>
</section>

<script>
const items=[
 {t:'Birthday',e:'🎂',m:'তোমার জন্মদিন মানেই আমার কাছে সবচেয়ে সুন্দর দিন। প্রতিটি জন্মদিনে তোমার পাশে থাকতে চাই।'},
 {t:'Proposal',e:'💍',m:'যেদিন তোমাকে মন খুলে বলেছিলাম, “আমি তোমাকে ভালোবাসি”—সেদিন থেকেই আমার পৃথিবী বদলে গেছে।'},
 {t:'First Day Meet',e:'✨',m:'প্রথম দেখার সেই মুহূর্তটা আজও চোখ বন্ধ করলে স্পষ্ট দেখতে পাই।'},
 {t:'First Gift',e:'🎁',m:'ছোট্ট একটা উপহার, কিন্তু তার ভেতরে ছিল অনেক বড় ভালোবাসা।'},
 {t:'First Call',e:'📞',m:'সেই রাতের কথাগুলো শেষ হয়নি আজও—শুধু আরও গভীর হয়েছে।'},
 {t:'Our Promise',e:'🤝',m:'সুখে-দুঃখে, কাছে-দূরে—সবসময় তোমার হাত ধরে থাকব।'},
 {t:'First Date',e:'🌹',m:'তোমার পাশে হাঁটা সেই প্রথম বিকেলটা আমার জীবনের সবচেয়ে সুন্দর স্মৃতিগুলোর একটা।'},
 {t:'Anniversary',e:'🥂',m:'প্রতিটি বছর পেরোয়, আর তোমার প্রতি আমার ভালোবাসা আরও বেড়ে যায়।'},
 {t:'Good Night',e:'🌙',m:'প্রতিদিন ঘুমানোর আগে আর ঘুম ভাঙার পর—প্রথম ভাবনাটা তুমি।'},
 {t:'Dream Together',e:'🌠',m:'আমাদের স্বপ্নগুলো একসাথে দেখব, আর একসাথেই সত্যি করব।'},
 {t:'Forever',e:'♾️',m:'তুমি আর আমি, এই ভালোবাসার মহাবিশ্বে চিরকাল একসাথে।'}
];
const $=id=>document.getElementById(id);
// background hearts
(function(){const bg=$('bg');for(let i=0;i<16;i++){const h=document.createElement('i');h.textContent='♥';h.style.left=Math.random()*100+'%';h.style.fontSize=(12+Math.random()*22)+'px';h.style.animationDuration=(9+Math.random()*10)+'s';h.style.animationDelay=(-Math.random()*14)+'s';bg.appendChild(h)}
for(let i=0;i<18;i++){const p=document.createElement('div');p.className='petal';const s=9+Math.random()*10;p.style.width=s+'px';p.style.height=s*1.25+'px';p.style.left=Math.random()*100+'%';p.style.animationDuration=(8+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*16)+'s';bg.appendChild(p)}
for(let i=0;i<26;i++){const s=document.createElement('div');s.className='spark';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(-Math.random()*3)+'s';s.style.animationDuration=(2+Math.random()*3)+'s';bg.appendChild(s)}})();
// chips
const stage=$('stage');const chips=items.map((it,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=it.e+' '+it.t;b.addEventListener('click',()=>openM(it));stage.appendChild(b);return b});
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let ang=0,last=0,paused=false;
function frame(ts){const dt=last?Math.min(ts-last,50):0;last=ts;if(!paused&&!still)ang+=dt*0.00022;
 const W=stage.clientWidth,H=stage.clientHeight,rx=W*0.38,ry=H*0.46;
 chips.forEach((c,i)=>{const a=ang+i*2*Math.PI/chips.length;const x=Math.cos(a),d=Math.sin(a);
  const s=0.82+0.18*(d+1)/2;const px=W/2+x*rx-c.offsetWidth/2,py=H/2+d*ry*0.9-c.offsetHeight/2;
  c.style.transform=`translate(${px}px,${py}px) scale(${s})`;c.style.opacity=0.55+0.45*(d+1)/2;c.style.zIndex=Math.round((d+1)*10)});
 requestAnimationFrame(frame)}
// views
function show(){$('intro').classList.add('hide');$('love').classList.remove('hide');}
$('intro').addEventListener('click',show);
$('intro').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}});
$('back').addEventListener('click',()=>{$('love').classList.add('hide');$('intro').classList.remove('hide')});
function openM(it){$('mEm').textContent=it.e;$('mT').textContent=it.t;$('mP').textContent=it.m;$('modal').classList.add('on');paused=true}
function closeM(){$('modal').classList.remove('on');paused=false}
$('modal').addEventListener('click',closeM);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
requestAnimationFrame(frame);
</script>
